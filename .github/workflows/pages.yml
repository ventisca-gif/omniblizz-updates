name: Publish OmniBlizz website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: omniblizz-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified Original 1.75 resources
        run: python3 build-tools/assemble179.py
      - name: Reconstruct verified Original 1.76 artwork
        run: python3 build-tools/assemble180.py
      - name: Reconstruct verified Original 1.77 city
        run: python3 build-tools/assemble181.py
      - name: Download and verify the public web build
        run: python3 website/download.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4