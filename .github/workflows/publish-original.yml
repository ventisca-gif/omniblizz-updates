name: Publish Original content
on:
  push:
    branches: [main]
    paths: ['releases/original/**', 'build-tools/**', '.github/workflows/publish-original.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-original
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load verified Original 1.99.3 public source bundle
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile,json,hashlib
          bundle=Path('OmniBlizz-Original-2.04.1-Publico.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()=='af4fe010998cc6385ab9a88f007df1afef4f43c8b2a9caade8923e2401403010'
          with zipfile.ZipFile(bundle) as z:
              files=json.loads(z.read('files-sha256.json'))
              for name,digest in files.items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name.startswith(('build-tools/','releases/original/','.github/workflows/'))
                  data=z.read('repository/'+name)
                  assert hashlib.sha256(data).hexdigest()==digest
                  if name.startswith('.github/'):continue
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(data)
          PYCODE
      - name: Load verified 2.04.2 delta source bundle
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile,json,hashlib
          bundle=Path('OmniBlizz-Original-2.04.2-Delta-Publico.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()=='32826f0e746468c703309d6389d5965095895ade2c3a764a8b9d003a3a32f56b'
          with zipfile.ZipFile(bundle) as z:
              files=json.loads(z.read('files-sha256.json'))
              for name,digest in files.items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name.startswith(('build-tools/','releases/original/','.github/workflows/'))
                  data=z.read('repository/'+name)
                  assert hashlib.sha256(data).hexdigest()==digest
                  if name.startswith('.github/'):continue
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(data)
          PYCODE
      - name: Reconstruct verified Original 1.75 resources
        run: python3 build-tools/assemble179.py
      - name: Reconstruct verified Original 1.76 artwork
        run: python3 build-tools/assemble180.py
      - name: Reconstruct verified Original 1.77 city
        run: python3 build-tools/assemble181.py
      - name: Install pinned lossless image encoder
        run: 'python3 -m pip install --only-binary=:all: Pillow==12.3.0'
      - name: Derive verified Original 1.78 from public 1.77
        run: python3 build-tools/assemble182.py
      - name: Reconstruct verified Original1.79 Saiyan and Capsule City
        run: python3 build-tools/assemble183.py
      - name: Reconstruct verified Original1.80 Kaioken and Namek preparations
        run: python3 build-tools/assemble184.py
      - name: Reconstruct verified Original1.81 training fixes
        run: python3 build-tools/assemble185.py
      - name: Reconstruct verified Original1.82 Namek
        run: python3 build-tools/assemble186.py
      - name: Reconstruct verified Original1.83 Anodite and Four Arms AF
        run: python3 build-tools/assemble187.py
      - name: Derive verified Original 1.84 lossless optimization
        run: python3 build-tools/assemble188.py
      - name: Reconstruct verified Original 1.85 full downloadable content
        run: python3 build-tools/assemble189.py
      - name: Reconstruct verified Original 1.88 HUD and Four Arms fixes
        run: python3 build-tools/assemble192.py
      - name: Reconstruct verified Original1.89 performance fixes
        run: python3 build-tools/assemble193.py
      - name: Reconstruct verified Original1.90 deep performance fixes
        run: python3 build-tools/assemble194.py
      - name: Reconstruct verified Original1.91 Anodite menu and Brainstorm fixes
        run: python3 build-tools/assemble195.py
      - name: Reconstruct verified Original1.92 Plumber base and Fasttrack
        run: python3 build-tools/assemble196.py
      - name: Reconstruct verified Original1.93 Highbreed patrols and Fasttrack fixes
        run: python3 build-tools/assemble197.py
      - name: Reconstruct verified Original 1.94 floor and Omnipedia repairs
        run: python3 build-tools/assemble198.py
      - name: Reconstruct verified Original 1.95 floor and Omnipedia repairs
        run: python3 build-tools/assemble199.py
      - name: Reconstruct verified Original 1.96 performance repair
        run: python3 build-tools/assemble200.py
      - name: Reconstruct and validate Original 1.97 updater compatibility
        run: python3 build-tools/assemble201.py
      - name: Reconstruct and validate Original 1.98 updater compatibility
        run: python3 build-tools/assemble202.py
      - name: Reconstruct and validate Original 1.99 updater compatibility
        run: python3 build-tools/assemble203.py
      - name: Reconstruct and validate Original 1.99 updater compatibility
        run: python3 build-tools/assemble204.py
      - name: Reconstruct and validate Original 1.99 updater compatibility
        run: python3 build-tools/assemble205.py
      - name: Reconstruct and verify Original 1.99.3 recovery
        run: python3 build-tools/assemble206.py
      - name: Reconstruct and verify Original 2.00.0 Rojo
        run: python3 build-tools/assemble207.py
      - name: Reconstruct and verify Original 2.00.1 walkable flower bed
        run: python3 build-tools/assemble208.py
      - name: Reconstruct and verify Original 2.01.0 Flowey and Toriel opening
        run: python3 build-tools/assemble209.py
      - name: Reconstruct and verify Original 2.02.0 Flowey and Toriel opening
        run: python3 build-tools/assemble210.py
      - name: Reconstruct and verify Original 2.02.1 Flowey and Toriel opening
        run: python3 build-tools/assemble211.py
      - name: Reconstruct and verify Original 2.03.0 Recalibrated quick switch
        run: python3 build-tools/assemble212.py
      - name: Reconstruct and verify Original 2.03.1 circular dials without black rectangles
        run: python3 build-tools/assemble213.py
      - name: Reconstruct and verify Original 2.04.0 independent combat mastery
        run: python3 build-tools/assemble214.py
      - name: Reconstruct and verify Original 2.04.1 visible combat mastery HUD
        run: python3 build-tools/assemble215.py
      - name: Reconstruct and verify Original 2.04.2 mastery fixes
        run: python3 build-tools/assemble216.py
      - name: Validate signature and prepare release
        id: prepare
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,re,subprocess,tempfile,hashlib
          root=pathlib.Path('releases/original')
          releases=[]
          for path in root.glob('*/original-manifest.json'):
              envelope=json.loads(path.read_text())
              raw=base64.b64decode(envelope['payload'],validate=True)
              signature=base64.b64decode(envelope['signature'],validate=True)
              with tempfile.TemporaryDirectory() as d:
                  p=pathlib.Path(d);(p/'payload').write_bytes(raw);(p/'signature').write_bytes(signature)
                  subprocess.run(['openssl','dgst','-sha256','-verify','original-update-public.pem','-signature',str(p/'signature'),str(p/'payload')],check=True)
              m=json.loads(raw)
              assert m['edition']=='original' and m['schema']==1
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',m['version'])
              assert isinstance(m['revision'],int) and m['revision']>=147
              assert path.parent.name==m['version']
              for f in m['files']:
                  expected=f"https://github.com/ventisca-gif/omniblizz-updates/releases/download/v{m['version']}/original-{f['sha256']}.bin"
                  assert f['url']==expected
                  data=(path.parent/('original-'+f['sha256']+'.bin')).read_bytes()
                  assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256']
              releases.append((m['revision'],path.parent,m['version']))
          _,directory,version=max(releases)
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:
              f.write(f'directory={directory}\ntag=v{version}\nversion={version}\n')
          PY
      - name: Publish verified Original assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.prepare.outputs.directory }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; immutable publication is left unchanged.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_DIRECTORY/original-manifest.json" "$RELEASE_DIRECTORY/original-content-manifest.json" "$RELEASE_DIRECTORY/release-notes.md" --target "$GITHUB_SHA" --title "OmniBlizz Original $RELEASE_VERSION" --notes-file "$RELEASE_DIRECTORY/release-notes.md" --draft
          shopt -s nullglob
          assets=("$RELEASE_DIRECTORY"/*.bin)
          if ((${#assets[@]})); then
            gh release upload "$RELEASE_TAG" "${assets[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
