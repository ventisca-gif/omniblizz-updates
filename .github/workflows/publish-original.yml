name: Publish approved OmniBlizz Original OTA

on:
  push:
    branches: [main]
    paths:
      - 'releases/original/**'
      - '.github/workflows/publish-original.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version firmada a publicar (ej. 2.43.27); vacio selecciona la unica pendiente'
        required: false
        type: string

concurrency:
  group: omniblizz-original-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Revisar release firmada (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.signed.outputs.ready }}
      version: ${{ steps.signed.outputs.version }}
      directory: ${{ steps.signed.outputs.directory }}
    steps:
      - name: Checkout sin credenciales
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probar reglas de firmas y no regresion
        run: python3 -m unittest discover -s automation -p 'test_*.py' -v

      - name: Verificar unica nueva version, firmas y recursos
        id: signed
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 automation/verify_staged_release.py \
            --root releases/original \
            --version "${REQUESTED_VERSION}" \
            --output "${GITHUB_OUTPUT}"

  publish:
    name: Publicar solamente con autorizacion activada
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: original-release
    permissions:
      contents: write
    steps:
      - name: Comprobar autorizacion explicita del entorno
        env:
          ENABLED: ${{ vars.OMNIBLIZZ_RELEASES_ENABLED }}
        run: |
          if [ "${ENABLED}" != "true" ]; then
            echo "BLOQUEADO: Settings > Environments > original-release > OMNIBLIZZ_RELEASES_ENABLED debe ser true"
            exit 1
          fi

      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Revalidar firmas y contenido antes de publicar
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 automation/verify_staged_release.py \
            --root releases/original \
            --version "${RELEASE_VERSION}"

      - name: Crear Release como borrador, subir BIN y publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_DIRECTORY: ${{ needs.verify.outputs.directory }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "BLOQUEADO: la release ${TAG} ya existe (publicada o borrador); no se modifica"
            exit 1
          fi
          gh release create "${TAG}" \
            "${RELEASE_DIRECTORY}/original-manifest.json" \
            "${RELEASE_DIRECTORY}/original-content-manifest.json" \
            "${RELEASE_DIRECTORY}/release-notes.md" \
            "${RELEASE_DIRECTORY}/SHA256SUMS.json" \
            --target "${GITHUB_SHA}" \
            --title "OmniBlizz Original ${RELEASE_VERSION}" \
            --notes-file "${RELEASE_DIRECTORY}/release-notes.md" \
            --draft
          shopt -s nullglob
          assets=("${RELEASE_DIRECTORY}"/*.bin)
          if (("${#assets[@]}" != 2)); then
            echo 'BLOQUEADO: se esperaban exactamente dos BIN'
            exit 1
          fi
          gh release upload "${TAG}" "${assets[@]}"
          gh release edit "${TAG}" --draft=false --latest
          echo "PUBLICADO: ${TAG}"
